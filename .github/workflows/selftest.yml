name: selftest

permissions:
  contents: read

on:
  pull_request:

jobs:
  selftest:
    # ubuntu-only, PR-triggered only: see PR #3 for the reasoning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The tool is standard library only, so the runner's own interpreter is
      # the one worth testing. Adding setup-python would test a version this
      # fleet does not run.
      - run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('vardemem.py').read_text())"
      # From a directory that is NOT the checkout, so a selftest that quietly
      # depended on sitting next to something fails here rather than in a year.
      - run: cd "$RUNNER_TEMP" && python3 "$GITHUB_WORKSPACE/vardemem.py" selftest
      - run: python3 vardemem.py selftest

  plugin-tests:
    # Every plugin ships stdlib-only smoke suites. Run them in CI so the
    # validation is real, not only run by hand (.github/WORKFLOWS.md: a workflow
    # must run what it claims). No network, no writes outside a temp dir.
    # A new suite gets a row here in the PR that adds it, or it never runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 plugins/memory-hygiene/tests/smoke-enforce-memory-routing.py
      - run: python3 plugins/memory-hygiene/tests/smoke-scan.py
      - run: python3 plugins/memory-hygiene/tests/smoke-snapshot.py
      - run: python3 plugins/journal/tests/smoke-enforce-journal-entry.py
      - run: python3 plugins/journal/tests/smoke-enforce-journal-tags.py
      - run: python3 plugins/journal/tests/smoke-preload-spine.py
