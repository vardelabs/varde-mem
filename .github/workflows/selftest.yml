name: selftest

permissions:
  contents: read

on:
  pull_request:

jobs:
  selftest:
    # ubuntu-only: nothing here is OS-specific (POSIX stat/symlink checks
    # behave the same on Linux and macOS), and GitHub bills macOS runners
    # at roughly 10x the Linux per-minute rate for no coverage this tool
    # actually needs. A push to main is always a commit a PR already ran
    # this against, so push-triggering it again is pure re-billing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The tool is standard library only, so the runner's own interpreter is
      # the one worth testing. Adding setup-python would test a version this
      # fleet does not run.
      - run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('vardemem.py').read_text())"
      # From a directory that is NOT the checkout, so a selftest that quietly
      # depended on sitting next to something fails here rather than in a year.
      - run: cd "$RUNNER_TEMP" && python3 "$GITHUB_WORKSPACE/vardemem.py" selftest
      - run: python3 vardemem.py selftest
