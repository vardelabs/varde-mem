name: no-journal-content

# Reject the STRUCTURED history artifacts (Public-ready rule, README.md) in every
# commit the event introduces, not just the tip: a file added then removed stays
# reachable, so a tip-only scan would pass it (#164 wants the whole history safe).
# .gitignore stops an accidental `git add`; this stops a deliberate `git add -f`,
# including one a later commit hides. The repo uses no LFS and no submodules, so a
# Git LFS pointer or a gitlink is rejected outright (both hide content the scans
# cannot read). It is not a content classifier: raw journal prose in an
# arbitrarily named file has no stable signature, and the pre-PR diff read
# (CONTRIBUTING.md) is the control there. It runs on push as well as pull_request,
# so a direct push cannot slip a file past a PR-only gate.

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the event's commit range resolves. No LFS smudge: the
          # object is never fetched; the pointer blob is matched by signature below.
          fetch-depth: 0
      - name: Reject journal or index files in any introduced commit
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          empty=$(git hash-object -t tree /dev/null)

          # The commits this event introduces (push: before..head; PR: base..head).
          # A missing, all-zero, or absent base (new branch, first push, or a base a
          # force-push rewrote away) falls back to the empty tree: scan everything.
          if [ "${EVENT:-}" = "pull_request" ]; then
            base="${PR_BASE:-}"; head="${PR_HEAD:-HEAD}"
          else
            base="${PUSH_BEFORE:-}"; head="${GITHUB_SHA:-HEAD}"
          fi
          case "$base" in ''|0000000000000000000000000000000000000000) base="$empty" ;; esac
          if [ "$base" != "$empty" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$empty"
          fi
          commits=$(git rev-list "${base}..${head}")
          # An empty range (head already an ancestor of base) would scan nothing;
          # examine the head commit itself instead.
          [ -n "$commits" ] || commits="$head"

          pattern='(^|/)(journal-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md|[0-9]{4}-[0-9]{2}-[0-9]{2}\.md|SPINE\.md|\.vardemem\.json|\.spine\.lock|.+\.md\.tmp.*)$'
          spine_header='^> Decayed index over the journal\. One line per recorded day'
          lfs_pointer='^version https://git-lfs\.github\.com/spec/v1'

          # NUL-delimited so a newline in a path (a legal, config-reachable journal
          # dir name) stays one record. --name-only puts `^` at the path start; the
          # full record carries the mode for the gitlink check. A git failure aborts.
          names=$(mktemp)
          trap 'rm -f "${names:-}" "${modes:-}"' EXIT
          modes=$(mktemp)
          for c in $commits; do
            git ls-tree -r -z --name-only "$c" >> "$names"
            git ls-tree -r -z "$c" >> "$modes"
          done

          # Decide by exit status, not captured output (NUL output would warn and be
          # stripped). `grep -q` reads a file, not a pipe, so it cannot SIGPIPE a
          # producer. The content scan matches the spine's fixed header line (no
          # interpolated path, so no journal name splits it); the LFS scan matches a
          # pointer, since a custom-named LFS index is a pointer here. Exit > 1 (a
          # real error, not "no match") fails closed.
          set +e
          grep -zqaE "$pattern" "$names"; nrc=$?
          grep -zqaE '^160000 ' "$modes"; grc=$?
          git grep -qE "$spine_header" $commits; crc=$?
          git grep -qE "$lfs_pointer" $commits; lrc=$?
          set -e
          for rc in "$nrc" "$grc" "$crc" "$lrc"; do
            if [ "$rc" -gt 1 ]; then
              echo "::error::a scan failed (exit $rc); cannot verify the introduced commits."
              exit 1
            fi
          done

          if [ "$nrc" -eq 0 ] || [ "$grc" -eq 0 ] || [ "$crc" -eq 0 ] || [ "$lrc" -eq 0 ]; then
            echo "::error::A journal day file, a derived index (by name, by its header, or hidden as an LFS object), or a submodule is present in a commit this event introduces. These never enter this repository, in any reachable commit."
            if [ "$nrc" -eq 0 ]; then grep -zaE "$pattern" "$names" | tr '\0' '\n' | sort -u; fi
            if [ "$grc" -eq 0 ]; then grep -zaE '^160000 ' "$modes" | tr '\0' '\n' | sort -u; fi
            if [ "$crc" -eq 0 ]; then git grep -lE "$spine_header" $commits; fi
            if [ "$lrc" -eq 0 ]; then git grep -lE "$lfs_pointer" $commits; fi
            exit 1
          fi
          echo "No journal or index files in the commits this event introduces."
