name: Feature request
description: Propose a change to vardemem or a plugin.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you need to do that VardeMem does not support today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >-
        The change you suggest. Say how it keeps the read bounded, the index
        derived, and the tool on the standard library.
    validations:
      required: true
